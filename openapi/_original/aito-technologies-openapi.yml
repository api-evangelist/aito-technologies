---
openapi: 3.0.0
tags:
  - name: "schema"
    description: "Schema management for database tables"
  - name: "query"
    description: "Query endpoints for search, prediction, and analysis"
  - name: "data"
    description: "Data management endpoints for inserting, deleting, and optimizing"
  - name: "jobs"
    description: "Asynchronous jobs — submit long operations and poll for status/result"
  - name: "introspection"
    description: "Build and capability introspection — which core build answered, and which operators are live"

security:
  - ApiKeyAuth: []

paths:
  /api/v1/schema:
    get:
      tags:
        - "schema"
      description: "Return the schema that is provisioned at the moment."
      operationId: "schema"
      responses:
        200:
          description: "The current active schema"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserDefinedDatabaseSchema"
    put:
      tags:
        - "schema"
      description: "Initialize the database with a new schema."
      operationId: "schema"
      requestBody:
        description: "The aito schema definition"
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserDefinedDatabaseSchema"
      responses:
        200:
          description: "The current active schema"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserDefinedDatabaseSchema"
    delete:
      tags:
        - "schema"
      description: "Delete every TABLE (type table, on either engine) and its stored data. v2 collections (type collection) and other entries of the database (such as a mounted repository) are kept — drop a collection with DELETE /api/v2/schema/{name}. If a kept collection links into a table being deleted, the whole delete is refused with a 400 naming the link, and nothing is deleted."
      operationId: "schema"
      responses:
        200:
          description: "The summary of deletion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteSchemaResponse"

  /api/v1/schema/{table}:
    get:
      tags:
        - "schema"
      description: "Return the schema of the specified table."
      operationId: "schema"
      parameters:
        - $ref: "#/components/parameters/Table"
      responses:
        200:
          description: "The current schema of the table"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserDefinedTableSchema"
    put:
      tags:
        - "schema"
      description: "Add the specified table to the schema. **NOTE**: If a table with the same name
      exists in the database, the operation deletes all data in this table and updates the table with the
      specified schema."
      operationId: "schema"
      parameters:
        - $ref: "#/components/parameters/Table"
      requestBody:
        description: "The new schema of the table"
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserDefinedTableSchema"
      responses:
        200:
          description: "The current schema of the table"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserDefinedTableSchema"
    delete:
      tags:
        - "schema"
      description: "Deletes the specified table from the database."
      operationId: "schema"
      parameters:
        - $ref: "#/components/parameters/Table"
      responses:
        200:
          description: "The summary of deletion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteSchemaResponse"

  /api/v1/schema/{table}/{column}:
    get:
      tags:
        - "schema"
      description: "Return the schema of the specified column."
      operationId: "schema"
      parameters:
        - $ref: "#/components/parameters/Table"
        - $ref: "#/components/parameters/Column"
      responses:
        200:
          description: "The current schema of the column"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ColumnType"
    put:
      tags:
        - "schema"
      description: "Add or replace the specified column using the given schema."
      operationId: "schema"
      parameters:
        - $ref: "#/components/parameters/Table"
        - $ref: "#/components/parameters/Column"
      requestBody:
        description: "The schema of the column"
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewColumnType"
      responses:
        200:
          description: "The schema of the column"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ColumnType"
    delete:
      tags:
        - "schema"
      description: "Delete the specified column from a table."
      operationId: "schema"
      parameters:
        - $ref: "#/components/parameters/Table"
        - $ref: "#/components/parameters/Column"
      responses:
        200:
          description: "The summary of deletion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteSchemaResponse"

  /api/v1/schema/_rename:
    post:
      tags:
        - schema
      operationId: rename_table
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenameTableOperation"
      responses:
        200:
          description: "Rename Table results"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmptyDocument"
        400:
          description: Invalid request body

  /api/v1/schema/_copy:
    post:
      tags:
        - schema
      operationId: copy_table
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CopyTableOperation"
      responses:
        200:
          description: "Copy Table results"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmptyDocument"
        400:
          description: Invalid request body

  /api/v1/data/{table}:
    post:
      tags:
        - "data"
      description: "Insert a single data entry intp the specified table."
      parameters:
        - $ref: "#/components/parameters/Table"
      requestBody:
        required: true
        description: "Any object which is valid according to the provisioned schema"
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserDefinedObjectInternalWrapper"

      responses:
        200:
          description: "The inserted entry"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserDefinedObjectInternalWrapper"

        400:
          description: "Invalid request body"

  /api/v1/data/{table}/batch:
    post:
      tags:
        - "data"
      description: "Insert a batch of data entries into the specfied table. The batch is assumed to be a JSON
      array of valid entries according to the provisioned schema. ***NOTE***: Batch API supports maximum
      payloads of 10MB."
      parameters:
        - $ref: "#/components/parameters/Table"
      requestBody:
        required: true
        description: "An array of objects which are valid according to the provisioned schema"
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/UserDefinedObject"
      responses:
        200:
          description: "Summary of the inserted entries"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchImportResponse"
        400:
          description: "Invalid request body"

  /api/v1/data/{table}/optimize:
    post:
      tags:
        - data
      summary: optimize optimizes the database by rewriting it as a single segment.
      requestBody:
        required: true
        description: An empty object
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OptimizeOperation"
      responses:
        200:
          description: "An empty object"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OptimizeOperationResponse"
        400:
          description: Invalid request body

  /api/v1/data/{table}/file:
    post:
      tags:
        - "data"
      description: "The first step of inserting data entries into the specified table using file-upload.

      The operation returns a signed S3-URL and a method so that one can upload the file using the accepeted
      method. ***NOTE***: The file must be in gzip compressed [ndjson](http://ndjson.org/) format.

      The operation also returns an id that will be used when triggering file processing
      [See step 2](#/api/v1/data/{table}/file/{uuid})."
      parameters:
        - $ref: "#/components/parameters/Table"
      responses:
        200:
          description: "The details to execute the S3 upload and the job's id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileUploadStartResponse"
        400:
          description: "Invalid request body"

  /api/v1/data/{table}/file/{uuid}:
    post:
      tags:
        - "data"
      description: "The second step of inserting data entries into the specified table using file-upload
      [See the first step: Initiate file upload](#/api/v1/data/{table}/file).

      The operation starts the processing a previously uploaded file. ***NOTE***: The specified id must match
      the job id from the previous file upload initiation."
      parameters:
        - $ref: "#/components/parameters/Table"
        - $ref: "#/components/parameters/JobId"
      responses:
        200:
          description: "Processing started status"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileUploadProcessTriggerResponse"
        400:
          description: "Invalid request body"
    get:
      tags:
        - "data"
      description: "Return the current status of the specified file upload job using its id. ***NOTE***: The
      specfied id must match the job id from the previous [file upload initiation](#/api/v1/data/{table}/file)."

      parameters:
        - $ref: "#/components/parameters/Table"
        - $ref: "#/components/parameters/JobId"
      responses:
        200:
          description: "The file processing status"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileUploadProcessStatusResponse"
          400:
            description: "Invalid request body"

  /api/v1/data/_delete:
    post:
      tags:
        - data
      operationId: delete
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteOperation"
      responses:
        200:
          description: "Delete results"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteOperationResponse"
        400:
          description: Invalid request body

  /api/v1/data/_modify:
    post:
      tags:
        - data
      operationId: modify
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnyModification"
      responses:
        200:
          description: "Modify results"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnyModification"
        400:
          description: Invalid request body

  /api/v1/jobs/{query}:
    post:
      tags:
        - query
      parameters:
        - $ref: "#/components/parameters/Query"
      description: "Create a job for a query"
      responses:
        200:
          description: "Job info"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobsResponse"
        400:
          description: Invalid request body

  /api/v1/jobs/:
    get:
      tags:
        - query
      description: "Get status for all jobs"
      responses:
        200:
          description: "Job statuses"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobsStatusResponse"
        400:
          description: Invalid request body

  /api/v1/jobs/{uuid}:
    get:
      tags:
        - query
      description: "Get status for a job"
      responses:
        200:
          description: "Job status"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobsStatusResponse"
        400:
          description: Invalid request body
    delete:
      tags:
        - query
      description: "Cancel a running job. The job is interrupted and long operations such as evaluate stop cooperatively, completing as a cancelled job. Has no effect on a job that has already finished."
      responses:
        200:
          description: "Cancellation requested, or the job was no longer running"
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  status:
                    type: string
        404:
          description: "No job with the given id"

  /api/v1/jobs/{uuid}/result:
    get:
      tags:
        - query
      description: "Get result for an evaluate job query"
      responses:
        200:
          description: "Evaluate job result"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvaluateResponse"
        400:
          description: Invalid request body

  /api/v1/_search:
    post:
      tags:
        - query
      operationId: search
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchQuery"
      responses:
        200:
          description: "Search results"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DecoratedHits"
        400:
          description: Invalid request body

  /api/v1/_similarity:
    post:
      tags:
        - query
      operationId: similarity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SimilarityQuery"
      responses:
        200:
          description: "Similarity results"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DecoratedHits"
        400:
          description: Invalid request body

  /api/v1/_predict:
    post:
      tags:
        - query
      operationId: predict
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PredictQuery"
      responses:
        200:
          description: "Predict results"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DecoratedHits"
        400:
          description: Invalid request body

  /api/v1/_match:
    post:
      tags:
        - query
      operationId: match
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MatchQuery"
      responses:
        200:
          description: "Match results"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DecoratedHits"
        400:
          description: Invalid request body

  /api/v1/_recommend:
    post:
      tags:
        - query
      operationId: recommend
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecommendQuery"
      responses:
        200:
          description: "Recommend results"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DecoratedHits"
        400:
          description: Invalid request body

  /api/v1/_relate:
    post:
      tags:
        - query
      operationId: relate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RelateQuery"
      responses:
        200:
          description: "Relate results"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DecoratedHits"
        400:
          description: Invalid request body

  /api/v1/_query:
    post:
      tags:
        - query
      operationId: query
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Query"
      responses:
        200:
          description: "Query results"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DecoratedHits"
        400:
          description: Invalid request body

  /api/v1/_aggregate:
    post:
      tags:
        - query
      operationId: aggregate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AggregateQuery"
      responses:
        200:
          description: "Aggregate results"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DecoratedHits"
        400:
          description: Invalid request body

  /api/v1/_estimate:
    post:
      tags:
        - query
      operationId: estimate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EstimateQuery"
      responses:
        200:
          description: "Estimate results"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EstimateResult"
        400:
          description: Invalid request body

  /api/v1/_evaluate:
    post:
      tags:
        - query
      operationId: evaluate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvaluateQueryBase"
      responses:
        200:
          description: "Evaluate results"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvaluateResponse"
        400:
          description: Invalid request body

  /api/v1/_batch:
    post:
      tags:
        - query
      operationId: batch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BatchQuery"
      responses:
        200:
          description: "Batch results"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchQueryResults"
        400:
          description: Invalid request body

  /api/v2/schema:
    get:
      tags:
        - "schema"
      description: "Return the schema listing all tables and their types (table or collection)."
      operationId: "v2-schema-list"
      responses:
        200:
          description: "The current schema listing"
          content:
            application/json:
              schema:
                type: object
                properties:
                  schema:
                    type: object
                    additionalProperties:
                      type: object
                      properties:
                        type:
                          type: string
                          enum: ["table", "collection"]
    put:
      tags:
        - "schema"
      description: "Initialize the database with a new schema. Supports both table and collection types."
      operationId: "v2-schema-create"
      requestBody:
        required: true
        description: "The schema definition with table type annotations"
        content:
          application/json:
            schema:
              type: object
              properties:
                schema:
                  type: object
                  additionalProperties:
                    $ref: "#/components/schemas/V2TableDefinition"
      responses:
        200:
          description: "Status of the schema creation"
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  tables:
                    type: array
                    items:
                      type: string
  /api/v2/schema/{table}:
    put:
      tags:
        - "schema"
      description: "Create a new table with the specified schema. Use type 'collection' for CollectionDb
      (optimized for high throughput) or 'table' for legacy TableDb."
      operationId: "v2-schema-create-table"
      parameters:
        - $ref: "#/components/parameters/Table"
      requestBody:
        required: true
        description: "Table definition with type and column specifications"
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/V2TableDefinition"
      responses:
        200:
          description: "Status of the table creation"
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  table:
                    type: string
                  type:
                    type: string
        400:
          description: "Invalid request body or table already exists"
    get:
      tags:
        - "schema"
      description: "Return the schema definition for a specific table."
      operationId: "v2-schema-get-table"
      parameters:
        - $ref: "#/components/parameters/Table"
      responses:
        200:
          description: "The table schema definition"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2TableDefinition"
    delete:
      tags:
        - "schema"
      description: "Delete the specified table and its data."
      operationId: "v2-schema-delete-table"
      parameters:
        - $ref: "#/components/parameters/Table"
      responses:
        200:
          description: "Status of the table deletion"
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  table:
                    type: string
  /api/v2/schema/_copy:
    post:
      tags:
        - "schema"
      description: "Copy a table schema (without data) to a new table name."
      operationId: "v2-schema-copy"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: ["from", "copy"]
              properties:
                from:
                  type: string
                  description: "Source table name"
                copy:
                  type: string
                  description: "Target table name"
      responses:
        200:
          description: "Status of the copy operation"
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  from:
                    type: string
                  copy:
                    type: string
        400:
          description: "Invalid request body"
  /api/v2/schema/_infer:
    post:
      tags:
        - "schema"
      description: "Infer a schema from a JSON array of example rows WITHOUT creating a table (a dry run). Returns the inferred column types."
      operationId: "v2-schema-infer"
      requestBody:
        required: true
        description: "A JSON array of example objects."
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
      responses:
        200:
          description: "The inferred schema."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2TableDefinition"
  /api/v2/schema/{table}/_plan:
    post:
      tags:
        - "schema"
      parameters:
        - $ref: "#/components/parameters/Table"
      description: >
        Declarative schema diff (like `terraform plan`). Diffs the table's current
        schema against the target in the body and classifies each column as add,
        rebuild, drop, rejected (lossy), or no-op. Changes nothing.
      operationId: "v2-schema-plan"
      requestBody:
        required: true
        description: "The target V2TableDefinition."
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/V2TableDefinition"
      responses:
        200:
          description: "The plan: a per-column list of classified actions."
          content:
            application/json:
              schema:
                type: object
  /api/v2/schema/{table}/_apply:
    post:
      tags:
        - "schema"
      parameters:
        - $ref: "#/components/parameters/Table"
        - name: confirm
          in: query
          required: false
          description: "Set true to allow data-loss drops."
          schema:
            type: boolean
      description: >
        Declarative schema converge (like `terraform apply`). Runs the plan and
        executes it in one commit; refuses lossy/rejected changes, and refuses
        data-loss drops unless confirm=true. Idempotent.
      operationId: "v2-schema-apply"
      requestBody:
        required: true
        description: "The target V2TableDefinition."
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/V2TableDefinition"
      responses:
        200:
          description: "The applied changes."
          content:
            application/json:
              schema:
                type: object
        400:
          description: "A lossy/rejected change, or a drop without confirm=true."
  /api/v2/schema/{table}/{column}:
    put:
      tags:
        - "schema"
      parameters:
        - $ref: "#/components/parameters/Table"
        - $ref: "#/components/parameters/Column"
      description: >
        Add a new column, or alter an existing column's type / analyzer in place
        (the engine re-indexes; durable across optimize). Incompatible alters
        (e.g. Int -> String) are rejected. Optional 'value' backfills a new column.
      operationId: "v2-schema-column-put"
      requestBody:
        required: true
        description: "The column definition (type, plus optional nullable / analyzer / quantity / link / value)."
        content:
          application/json:
            schema:
              type: object
      responses:
        200:
          description: "The updated table schema."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2TableDefinition"
        400:
          description: "An incompatible alter."
  /api/v2/schema/{table}/_refresh:
    post:
      tags:
        - "schema"
      description: "Rebuild a table's materialised view from its source. Use after the data a view depends on has changed, to refresh the derived rows."
      operationId: "v2-schema-refresh"
      parameters:
        - $ref: "#/components/parameters/Table"
      responses:
        200:
          description: "Refresh summary"
          content:
            application/json:
              schema:
                type: object
        400:
          description: "Invalid request"

  /api/v2/data/{table}:
    post:
      tags:
        - "data"
      description: "Insert a single data entry into the specified table. Supports both TableDb and CollectionDb tables."
      operationId: "v2-data-insert"
      parameters:
        - $ref: "#/components/parameters/Table"
      requestBody:
        required: true
        description: "Any object valid according to the table schema"
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserDefinedObjectInternalWrapper"
      responses:
        200:
          description: "Status of the insert operation"
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  entries:
                    type: integer
        400:
          description: "Invalid request body"
  /api/v2/data/{table}/batch:
    post:
      tags:
        - "data"
      description: "Insert a batch of data entries into the specified table. The batch is a JSON array of
      valid entries according to the table schema. Supports both TableDb and CollectionDb tables."
      operationId: "v2-data-batch"
      parameters:
        - $ref: "#/components/parameters/Table"
      requestBody:
        required: true
        description: "An array of objects valid according to the table schema"
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/UserDefinedObject"
      responses:
        200:
          description: "Summary of the insert operation"
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  entries:
                    type: integer
        400:
          description: "Invalid request body"
  /api/v2/data/{table}/stream:
    post:
      tags:
        - "data"
      description: "Insert data entries using newline-delimited JSON (NDJSON) format. Each line is a
      separate JSON object. Supports both TableDb and CollectionDb tables."
      operationId: "v2-data-stream"
      parameters:
        - $ref: "#/components/parameters/Table"
      requestBody:
        required: true
        description: "Newline-delimited JSON objects"
        content:
          application/json:
            schema:
              type: string
              description: "NDJSON format - one JSON object per line"
      responses:
        200:
          description: "Summary of the insert operation"
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  entries:
                    type: integer
        400:
          description: "Invalid request body"
  /api/v2/data/{table}/_cluster:
    post:
      tags:
        - "data"
      description: "Fit a k-means codebook over a dense vector/embedding column and store each row's cluster id as a derived column — WITHOUT changing the declared schema. Turns embeddings into a categorical the query engine can use as evidence."
      operationId: "v2-data-cluster"
      parameters:
        - $ref: "#/components/parameters/Table"
      requestBody:
        required: true
        description: "Cluster spec: the source vector column, the codebook size, and an optional output-column name."
        content:
          application/json:
            schema:
              type: object
              required:
                - "column"
              properties:
                column:
                  type: string
                  description: "The dense vector/embedding column to cluster."
                k:
                  type: integer
                  description: "Number of clusters (codebook size). Default 64."
                as:
                  type: string
                  description: "Name of the derived cluster-id column. Default <column>_cluster."
      responses:
        200:
          description: "Cluster summary"
          content:
            application/json:
              schema:
                type: object
        400:
          description: "Invalid request"
  /api/v2/data/{table}/optimize:
    post:
      tags:
        - "data"
      summary: "Optimize the table by merging segments for better read performance."
      operationId: "v2-data-optimize"
      parameters:
        - $ref: "#/components/parameters/Table"
      requestBody:
        required: true
        description: "An empty object"
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OptimizeOperation"
      responses:
        200:
          description: "An empty object"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OptimizeOperationResponse"
        400:
          description: "Invalid request body"
  /api/v2/data/{table}/repair:
    post:
      tags:
        - "data"
      summary: "Rebuild the table's binary from its seed (recovery). Use when a collection reads on a plain query but errors on a filtered/predict/nested read; unlike optimize, repair regrows from the source rows and can recover a structurally-broken segment."
      operationId: "v2-data-repair"
      parameters:
        - $ref: "#/components/parameters/Table"
      requestBody:
        required: true
        description: "An empty object"
        content:
          application/json:
            schema:
              type: object
      responses:
        200:
          description: "An empty object"
          content:
            application/json:
              schema:
                type: object
        400:
          description: "Invalid request body"
  /api/v2/data/_delete:
    post:
      tags:
        - "data"
      description: "Delete the rows matching a where clause — exactly the rows a _query with the same where returns. Supports both TableDb and CollectionDb tables. The where is a field value (equality), a field condition with $eq, $ne, $lt, $lte, $gt, $gte, $in or $not, and $and / $or / $not around those. A negation selects the rows that HAVE a value other than the negated one (a row with the field unset is not deleted). An unknown operator or column is a 400, never a silent zero-row delete; an empty where is refused (drop the table instead)."
      operationId: "v2-data-delete"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: ["from"]
              properties:
                from:
                  type: string
                  description: "Table name"
                where:
                  type: object
                  description: "Query conditions for matching entries to delete"
      responses:
        200:
          description: "Number of deleted entries"
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
        400:
          description: "Invalid request body"
  /api/v2/data/_modify:
    post:
      tags:
        - "data"
      description: >
        Atomic table + data operations, applied in one commit. Accepts one operation
        object, or {operations: [...]} to apply several.
        ROW OPS: insert ({into, insert}), update ({update, set, where, upsert?}),
        delete ({from, delete}), backfill ({backfill, key, keys, columns, upsert?} -
        bulk-set column values on existing rows by key).
        TABLE OPS: copy ({from, copy, replace?}) grafts a table by reference
        (zero-copy); `from` may be a nested path (a/b), a subtree wildcard (a/*), or
        name another ref of this database as "ref:path" (env.NAME or release.NAME) to
        copy across branches/releases, and `copy` may itself be nested.
        move ({move, to, replace?}) relocates a top-level table to a new, possibly
        nested name (creates the sub-env, drops the source).
        link ({from, link, replace?}) stores a live reference resolved on every read,
        instead of a snapshot copy.
        rename ({from, rename}) renames a table.
        MAINTENANCE: optimize ({optimize}), repair ({repair}) rebuilds a table
        from its seed to recover a structurally-broken segment, warm ({warm: [queries]}).
        Requires a read-write API key.
      operationId: "v2-data-modify"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnyModification"
      responses:
        200:
          description: "Modification results"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnyModification"
        400:
          description: "Invalid request body"
  /api/v2/data/{table}/_backfill:
    post:
      tags:
        - "data"
      description: >
        Bulk-set column values on existing rows, matched by a business key — the compact
        way to populate a column with new values after adding it. The columnar body carries
        a `key` column name plus index-aligned `keys` and `columns` value arrays, so it stays
        small for large jobs. Applied in one commit; a key that matches no row is a no-op
        unless `upsert` is true. Sugar over the `backfill` operation of _modify; works on
        both TableDb and CollectionDb.
      operationId: "v2-data-backfill"
      parameters:
        - $ref: "#/components/parameters/Table"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: ["key", "keys", "columns"]
              properties:
                key:
                  type: string
                  description: "The business-key column used to match existing rows"
                keys:
                  type: array
                  description: "Key values, one per row to update"
                  items: {}
                columns:
                  type: object
                  description: "Column name -> array of new values, each array index-aligned to `keys`"
                  additionalProperties:
                    type: array
                    items: {}
                upsert:
                  type: boolean
                  default: false
                  description: "If true, insert a new row for a key that matches nothing"
      responses:
        200:
          description: "Number of rows updated (plus inserted, when upsert)"
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
        400:
          description: "Invalid request body (missing key/keys/columns, or arrays not index-aligned)"
  /api/v2/data/{table}/import:
    post:
      tags:
        - "data"
      description: >
        Schema-flexible JSON import: POST an array of objects and Aito infers the
        column types, creating the table if it doesn't exist and appending if it
        does (extending the schema with any new fields — existing rows get null).
        Use ?type=table to create a legacy rep1 table instead of a collection.
      operationId: "v2-data-import"
      parameters:
        - $ref: "#/components/parameters/Table"
        - name: type
          in: query
          required: false
          description: "collection (default) or table."
          schema:
            type: string
            enum: ["collection", "table"]
      requestBody:
        required: true
        description: "A JSON array of objects to import."
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
      responses:
        200:
          description: "Import status, count, and the (inferred) schema."
        400:
          description: "Invalid request body"

  /api/v2/_query:
    post:
      tags:
        - "query"
      description: "Unified query endpoint. Automatically detects query type (search, predict) from
      the JSON payload. Supports both TableDb and CollectionDb tables."
      operationId: "v2-query"
      requestBody:
        required: true
        description: "Query in JSON format. Must include 'from' to specify the table."
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/V2Query"
      responses:
        200:
          description: "Query results"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2QueryResponse"
        400:
          description: "Invalid query"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v2/_search:
    post:
      tags:
        - "query"
      description: "Search endpoint (alias for _query). Returns entries matching the where clause."
      operationId: "v2-search"
      requestBody:
        required: true
        description: "Search query with optional where clause, select, orderBy, offset, limit."
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/V2Query"
      responses:
        200:
          description: "Search results"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2QueryResponse"
        400:
          description: "Invalid query"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v2/_predict:
    post:
      tags:
        - "query"
      description: "Predict endpoint (alias for _query). Returns predictions for the specified
      target field based on the provided context."
      operationId: "v2-predict"
      requestBody:
        required: true
        description: "Prediction query with 'predict' and optional 'basedOn' fields."
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/V2Query"
      responses:
        200:
          description: "Prediction results"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2QueryResponse"
        400:
          description: "Invalid query"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v2/_recommend:
    post:
      tags:
        - "query"
      description: "Recommend endpoint (alias for _query). Use 'recommend' (a link field) with 'goal' to rank candidates by the probability of the goal outcome."
      operationId: "v2-recommend"
      requestBody:
        required: true
        description: "Recommend query with 'recommend' and 'goal'."
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/V2Query"
      responses:
        200:
          description: "Recommendation results"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2QueryResponse"
        400:
          description: "Invalid query"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v2/_relate:
    post:
      tags:
        - "query"
      description: "Relate endpoint (alias for _query). Use 'relate' (an array of fields) to return statistical relations to the where context instead of rows."
      operationId: "v2-relate"
      requestBody:
        required: true
        description: "Relate query with a 'relate' array."
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/V2Query"
      responses:
        200:
          description: "Relation statistics"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2QueryResponse"
        400:
          description: "Invalid query"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v2/_aggregate:
    post:
      tags:
        - "query"
      description: "Aggregate endpoint. Computes grouped aggregates (e.g. $sum / $mean / $count) over the where context. Engine-dispatched: rep2 collections run the native v2 aggregate, rep1 (type:table) tables run the v1 aggregate pipeline."
      operationId: "v2-aggregate"
      requestBody:
        required: true
        description: "Aggregate query with 'from', an optional 'where', and the aggregate expressions."
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/V2Query"
      responses:
        200:
          description: "Aggregate result. Response envelope: {\"kind\": \"aggregate\", \"data\": { ... }} with optional 'meta' and 'warnings'."
          content:
            application/json:
              schema:
                type: object
                properties:
                  kind:
                    type: string
                    example: "aggregate"
                  data:
                    type: object
                    description: "The aggregate values."
                  meta:
                    type: object
                  warnings:
                    type: array
                    items:
                      type: object
        400:
          description: "Invalid query"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v2/_estimate:
    post:
      tags:
        - "query"
      description: "Estimate endpoint. Returns the estimated probability of a proposition given the where context. Engine-dispatched (rep2 native / rep1 v1 pipeline)."
      operationId: "v2-estimate"
      requestBody:
        required: true
        description: "Estimate query with 'from', a 'where' context, and the proposition to estimate."
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/V2Query"
      responses:
        200:
          description: "Estimate result. Response envelope: {\"kind\": \"estimate\", \"data\": { ... }}."
          content:
            application/json:
              schema:
                type: object
                properties:
                  kind:
                    type: string
                    example: "estimate"
                  data:
                    type: object
        400:
          description: "Invalid query"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v2/_evaluate:
    post:
      tags:
        - "query"
      description: "Evaluate endpoint. Runs a query over a held-out set (via '$get' bindings) and reports accuracy metrics. Engine-dispatched: rep1 (type:table) tables run the v1 EvaluateQuery pipeline, which evaluates predict, recommend, relate, match, similarity and estimate (mae/rmse/r2) queries; rep2 collections evaluate a PREDICT or an ESTIMATE query (estimate: mae/rmse/r2 against a train-mean baseline), and refuse the other kinds with a message pointing to https://aito.ai/docs/api/v2/evaluation/#engines."
      operationId: "v2-evaluate"
      requestBody:
        required: true
        description: "Evaluate query: a predict or estimate query plus the test-row bindings to evaluate against."
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/V2Query"
      responses:
        200:
          description: "Evaluation result. Response envelope: {\"kind\": \"evaluation\", \"data\": { ... }} (accuracy and related metrics)."
          content:
            application/json:
              schema:
                type: object
                properties:
                  kind:
                    type: string
                    example: "evaluation"
                  data:
                    type: object
        400:
          description: "Invalid query"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v2/_sql:
    post:
      tags:
        - "query"
      description: "SQL endpoint. Executes a single SQL SELECT statement against the collections in the database. A SQL skin over the same Query2 engine as _query. The DEFAULT response is the pg-format — the REST rendering of a PostgreSQL result ({command, rowCount, total, fields, rows}; fields carries the wire protocol's RowDescription attributes, rows are positional arrays), which expresses column order, column types, duplicate names and NULL-vs-absent. ?format=hits returns the pre-v2.8 v2 result JSON instead, the same shape _query returns."
      operationId: "v2-sql"
      parameters:
        - name: "format"
          in: "query"
          required: false
          schema:
            type: string
            enum: ["pg", "hits"]
            default: "pg"
          description: "Response rendering: 'pg' (default) = the PostgreSQL result shape; 'hits' = the v2 result JSON (_query's shape). An unknown value is a 400, never silently defaulted."
      requestBody:
        required: true
        description: "A single SQL SELECT statement as a plain-text body (Content-Type text/plain or application/json)."
        content:
          text/plain:
            schema:
              type: string
              example: "SELECT color, count(*) FROM products GROUP BY color"
      responses:
        200:
          description: "SQL result set. Default: the pg-format object; with ?format=hits: the v2 result JSON."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2SqlPgResponse"
        400:
          description: "Invalid SQL"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v2/_batch:
    post:
      tags:
        - "query"
      description: "Run a JSON array of v2 queries in one request; returns an array of results in order."
      operationId: "v2-batch"
      requestBody:
        required: true
        description: "A JSON array of V2Query objects."
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/V2Query"
      responses:
        200:
          description: "An array of query results."
        400:
          description: "Invalid query"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v2/jobs/_evaluate:
    post:
      tags:
        - "jobs"
      description: "Submit an operation as an ASYNCHRONOUS job instead of holding it open on one HTTP request. Returns 201 Created with a JobDescription (id, path, startedAt); poll GET /api/v2/jobs/{id} for status and GET /api/v2/jobs/{id}/result for the result. This is the escape hatch for operations that can exceed the 15-minute request timeout — notably _evaluate on a rep2 collection, which runs with no maxTime budget. The same jobs/ prefix works for EVERY v2 op: query ops (jobs/_query, jobs/_search, jobs/_predict, jobs/_recommend, jobs/_relate, jobs/_evaluate, jobs/_aggregate, jobs/_estimate, jobs/_match, jobs/_batch, jobs/_sql) and write ops (jobs/data/{table}/batch, jobs/data/{table}/stream, jobs/data/{table}/optimize, jobs/data/_delete, jobs/data/_modify, jobs/data/{table} …)."
      operationId: "v2-jobs-submit"
      requestBody:
        required: true
        description: "The same body the synchronous endpoint takes (here, an evaluate query)."
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/V2Query"
      responses:
        201:
          description: "Job accepted; the body is a JobDescription carrying the job id."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobDescription"
        400:
          description: "Invalid query"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v2/jobs:
    get:
      tags:
        - "jobs"
      description: "List the jobs (running and recently finished) on this server. Jobs are shared across API versions, so a job submitted via /api/v1/jobs or /api/v2/jobs appears here."
      operationId: "v2-jobs-list"
      responses:
        200:
          description: "An array of JobDescriptions."
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JobDescription"
  /api/v2/jobs/{id}:
    get:
      tags:
        - "jobs"
      description: "Job status. While running, returns the JobDescription; once finished it adds a 'status' field ('ok' or 'failed'), and a failed job also carries an 'error' message. The same id is addressable under /api/v1/jobs/{id}."
      operationId: "v2-jobs-status"
      parameters:
        - name: id
          in: path
          required: true
          description: "The job id returned by the submit call."
          schema:
            type: string
            format: uuid
      responses:
        200:
          description: "The job status."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobDescription"
        404:
          description: "Unknown job id."
    delete:
      tags:
        - "jobs"
      description: "Request cancellation of a running job. Cancellation interrupts the worker; cooperative operations (e.g. _evaluate) stop at the next checkpoint and finish as cancelled. A job that has already finished returns status 'not_running'."
      operationId: "v2-jobs-cancel"
      parameters:
        - name: id
          in: path
          required: true
          description: "The job id to cancel."
          schema:
            type: string
            format: uuid
      responses:
        200:
          description: "Cancellation acknowledged ('cancelling'), or a no-op on a finished job ('not_running')."
        404:
          description: "Unknown job id."
  /api/v2/jobs/{id}/result:
    get:
      tags:
        - "jobs"
      description: "The job's result. Once the job has finished this is byte-identical to the synchronous endpoint's response. Returns 202 Accepted while the job is still running; a failed job returns its error."
      operationId: "v2-jobs-result"
      parameters:
        - name: id
          in: path
          required: true
          description: "The job id."
          schema:
            type: string
            format: uuid
      responses:
        200:
          description: "The finished job's result (the same body the synchronous endpoint returns)."
        202:
          description: "The job is still running; poll again."
        404:
          description: "Unknown job id."
  /api/v2/_version:
    get:
      tags:
        - "introspection"
      description: "The running core build. `version` is the human-meaningful release id — `X.Y.Z` on a release build, `X.Y.Z-dev+<build id>` otherwise — while `gitRevision` and `builtAt` carry exact provenance. A read API key is enough. Lets a caller record which build answered a request — and diff a deployment that changed a result underneath them."
      operationId: "v2-version"
      responses:
        200:
          description: "The BuildInfo of the running server."
          content:
            application/json:
              schema:
                type: object
  /api/v2/_ops:
    get:
      tags:
        - "introspection"
      description: "The live operator inventory — every query operator this build supports, each with a one-line context description, from the single source of truth the Query Reference is generated from. Lets a client render the capability set instead of hard-coding it. A read API key is enough."
      operationId: "v2-ops"
      responses:
        200:
          description: "The operator inventory."
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                  operators:
                    type: array
                    items:
                      type: object
                      properties:
                        token:
                          type: string
                          example: "$has"
                        context:
                          type: string
                          example: "where: token / membership"
  /api/v2/_envs:
    get:
      tags:
        - "envs"
      description: "List all environments. An environment is a named copy-on-write view of the database (branch, write independently, atomically promote), shared across API versions. A read API key is required. An environment is selected purely by URL path (see the branch endpoint); it is never chosen by a request body field, query parameter, or header."
      operationId: "v2-envs-list"
      responses:
        200:
          description: "The list of environments"
          content:
            application/json:
              schema:
                type: object
                properties:
                  envs:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
    post:
      tags:
        - "envs"
      description: "Branch a new environment from an existing one (copy-on-write, no data copy). A read-write API key is required. Once branched, address the env by URL path — prefix any request with /env/{name}/ (e.g. /env/v2-demo/api/v2/_query), or /db/{db}/env/{name}/ on a multi-tenant server. There is no env-scoped API key: the same key that reads or writes master reads or writes every env."
      operationId: "v2-envs-create"
      requestBody:
        required: true
        description: "The new environment name and the env to branch from."
        content:
          application/json:
            schema:
              type: object
              required: ["name"]
              properties:
                name:
                  type: string
                  description: "The name of the new environment"
                basedOn:
                  type: string
                  description: "The environment to branch from (default: env.master)"
      responses:
        200:
          description: "The created environment"
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                  basedOn:
                    type: string
        400:
          description: "Invalid request body"
  /api/v2/_envs/{name}:
    delete:
      tags:
        - "envs"
      description: "Delete an environment. The master environment cannot be deleted. A read-write API key is required."
      operationId: "v2-envs-delete"
      parameters:
        - name: name
          in: path
          required: true
          description: "The environment name"
          schema:
            type: string
      responses:
        200:
          description: "Status of the deletion"
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  name:
                    type: string
        400:
          description: "Cannot delete the master environment"
  /api/v2/_envs/{name}/promote:
    post:
      tags:
        - "envs"
      description: "Atomically swap an environment into master. The source env is not deleted and diverges from master on subsequent writes. A read-write API key is required."
      operationId: "v2-envs-promote"
      parameters:
        - name: name
          in: path
          required: true
          description: "The environment name"
          schema:
            type: string
      responses:
        200:
          description: "Status of the promote"
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  name:
                    type: string
        400:
          description: "Cannot promote master onto itself"
  /api/v2/_releases:
    get:
      tags:
        - "releases"
      description: "List published releases. A release is an immutable, named snapshot of the database head; a tenant database can mount a shared repository by release version. A read API key is required."
      operationId: "v2-releases-list"
      responses:
        200:
          description: "The list of releases"
          content:
            application/json:
              schema:
                type: object
                properties:
                  releases:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        hash:
                          type: string
    post:
      tags:
        - "releases"
      description: "Publish the current head as a new immutable release. Republishing an existing release name is refused (a release is frozen). A read-write API key is required."
      operationId: "v2-releases-publish"
      requestBody:
        required: true
        description: "The name of the release to publish."
        content:
          application/json:
            schema:
              type: object
              required: ["name"]
              properties:
                name:
                  type: string
                  description: "The release name (e.g. v1, 2026-07)"
      responses:
        200:
          description: "The published release"
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  name:
                    type: string
                  hash:
                    type: string
        400:
          description: "Invalid name, or a release with that name already exists"
  /api/v2/_releases/{name}:
    delete:
      tags:
        - "releases"
      description: "Retire (unpin) a release. Once retired, its head may be reclaimed by GC. A read-write API key is required."
      operationId: "v2-releases-retire"
      parameters:
        - name: name
          in: path
          required: true
          description: "The release name"
          schema:
            type: string
      responses:
        200:
          description: "Status of the retire"
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  name:
                    type: string
        404:
          description: "No such release"
  /api/v2/_refs:
    get:
      tags:
        - "refs"
      description: "List every ref in the database — branches (envs, including the default master) and releases — in one uniform view with role, mutability and head hash. Read-only; writes use the branch (_envs) and release (_releases) endpoints. A read API key is required."
      operationId: "v2-refs-list"
      parameters:
        - name: role
          in: query
          required: false
          description: "Filter by role: 'branch' or 'release'"
          schema:
            type: string
            enum: ["branch", "release"]
      responses:
        200:
          description: "The list of refs"
          content:
            application/json:
              schema:
                type: object
                properties:
                  refs:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        role:
                          type: string
                          enum: ["branch", "release"]
                        mutable:
                          type: boolean
                        default:
                          type: boolean
                          description: "Present and true for the default (master) branch"
                        head:
                          type: string
                          description: "Content hash of the ref's committed head"
  /api/v2/_refs/{name}:
    put:
      tags:
        - "refs"
      description: "Create or move a ref — generic write plumbing (v2 only). A release is immutable (publishing over an existing one is refused); moving an existing branch requires force=true; protected refs (system, _*) cannot be written. A read-write API key is required."
      operationId: "v2-refs-put"
      parameters:
        - name: name
          in: path
          required: true
          description: "The ref (e.g. 'sandbox', 'release.v1'; 'main' aliases the default branch)"
          schema:
            type: string
        - name: force
          in: query
          required: false
          description: "Allow moving an existing (mutable) branch"
          schema:
            type: boolean
      requestBody:
        required: false
        description: "The source ref to copy or freeze from."
        content:
          application/json:
            schema:
              type: object
              properties:
                from:
                  type: string
                  description: "Source branch (for a branch), or 'main' for a release"
      responses:
        200:
          description: "The created or moved ref"
        400:
          description: "Invalid ref or source"
        403:
          description: "The ref is protected"
        409:
          description: "The ref is an immutable release, or exists and force was not set"
    delete:
      tags:
        - "refs"
      description: "Delete a branch or retire a release (v2 only). The master branch and protected refs cannot be deleted. A read-write API key is required."
      operationId: "v2-refs-delete"
      parameters:
        - name: name
          in: path
          required: true
          description: "The ref to delete"
          schema:
            type: string
      responses:
        200:
          description: "Status of the delete"
        400:
          description: "Cannot delete the master branch"
        403:
          description: "The ref is protected"
        404:
          description: "No such ref"

components:
  parameters:
    Table:
      name: table
      in: path
      required: true
      description: The name of the table to add data to
      schema:
        type: string
    Column:
      name: table
      in: path
      required: true
      description: The name of the column
      schema:
        type: string
    Query:
      name: query
      in: path
      required: true
      description: Any of the Aito query endpoints
      schema:
        type: string
    JobId:
      name: uuid
      in: path
      required: true
      description: The assigned id of the operation
      schema:
        type: string

  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
  schemas:
    # The uniform v2 error envelope. EVERY v2 error — from any endpoint, at any
    # status — returns this shape: kind is always "error", data.code is a stable
    # machine code to branch on (the message wording is not contractual). See
    # ApiV2EndPoints.errorJson and docs/v2-response-format.md §4.
    "ErrorResponse":
      type: object
      description: "The v2 structured error body. Present whenever a request fails; `kind` is the literal string `error`. Branch on `data.code`, not on the HTTP status or the message text."
      properties:
        kind:
          type: string
          enum: ["error"]
          example: "error"
        data:
          type: object
          properties:
            code:
              type: string
              description: "Stable machine-readable error code. Query/read endpoints: query.invalid, request.invalid, proposition.unsupported (400), not_found (404), operation.unsupported (501), json.malformed (400), internal (500). Data/schema endpoints add data.bad_request, import.failed, table.exists, schema.not_collection, schema.create_failed, schema.column_update_failed, schema.refresh_failed, schema.plan_failed, schema.apply_failed (400)."
              example: "not_found"
            message:
              type: string
              description: "Human-readable, single-line explanation. Surface it; do not parse it."
              example: "Unknown table 'invoicess'"
          required:
            - code
            - message
      required:
        - kind
        - data
    # The async-job handle returned by POST /api/v2/jobs/<op> and by the
    # /api/v2/jobs status/list endpoints. `status`/`error` are present only
    # once the job has finished. See JobDescription / JobStatusService.
    "JobDescription":
      type: object
      description: "A handle to an asynchronous job. Returned by a jobs submit (201) and by the status/list endpoints. `finishedAt`, `status` and `error` appear only after the job completes."
      properties:
        id:
          type: string
          format: uuid
          description: "The job id; address it at /api/v2/jobs/{id}."
        path:
          type: string
          description: "The operation label (e.g. 'Evaluate', 'Batch insert')."
          example: "Evaluate"
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
          description: "Present once the job has finished."
        status:
          type: string
          enum: ["ok", "failed"]
          description: "Present once finished: 'ok', or 'failed' with an 'error'."
        error:
          type: string
          description: "Present when status is 'failed'."
      required:
        - id
        - startedAt
    # This object is used as a wrapper element in API operations where response or request is a
    # UserDefinedObject, because the API docs generator "inlines" the root type.
    "UserDefinedObjectInternalWrapper":
      type: object
      description: "Any object which is valid according to the database schema."
      oneOf:
        - $ref: "#/components/schemas/UserDefinedObject"

    "UserDefinedDatabaseSchema":
      type: object
      description: |
        "Any schema which is a valid Aito database schema.

        Schema describes the structure of the database in a formal language.
        The Aito schema is a collection of database objects (currently only tables)
        that contains its unique names, fields (or columns), and data types of the fields.
        The schema also contains information to help Aito preprocess your data. For
        example what language a textual data contains.

        The contents of the schema depends on the data that will be inserted into the database."

      required:
        - schema
      example: {
        "schema": {
          "products": {
            "type": "table",
            "columns": {
              "id": { "type": "Int" },
              "name": { "type": "String" },
              "price": { "type": "Decimal" },
              "description": { "type": "Text", "analyzer": "English" }
            }
          }
        }
      }
      properties:
        schema:
          type: object
          description: "Database tables. Each key-value pair is a table name and the table schema."
          properties:
            "<yourTableName>":
              $ref: "#/components/schemas/UserDefinedTableSchema"

    "UserDefinedTableSchema":
      type: object
      description: |
        "Any schema which is a valid Aito table schema.

        Table schema describes the structure of the table in a formal language.
        The schema describes all fields (or columns), data types of the fields, and information
        to help Aito preprocess your data. For example what language a textual data contains.

        The contents of the schema depends on the data that will be inserted into the database."
      example: {
        "type": "table",
        "columns": {
          "id": { "type": "Int", "nullable": false },
          "name": { "type": "String", "nullable": false },
          "price": { "type": "Decimal", "nullable": false },
          "description": { "type": "Text", "nullable": false, "analyzer": "English" }
        }
      }
      properties:
        type:
          type: string
          description: "Type of the database schema item. Currently only \"table\" is accepted."
          enum: ["table"]
        columns:
          type: object
          description: "Table columns. Each key-value pair is a column name and the column type."
          properties:
            "<yourColumnName>":
              $ref: "#/components/schemas/ColumnType"

    "ColumnType":
      type: object
      description: |
        "Type of the column.

        Describes an individual field (or column), the type, and information
        to help Aito preprocess your data. For example what language a textual data contains."
      example: { "type": "Int", "nullable": false }
      examples:
        - { "type": "int", "nullable": false }
        - { "type": "string", "nullable": false }
        - { "type": "decimal", "nullable": false }
        - { "type": "text", "nullable": false, "analyzer": "english" }
        - { "type": "json", "nullable": true }
        - { "type": "Int[]" }
        - { "type": "String[]", "nullable": true }
        - { "type": "Vector", "dimensions": 384, "similarity": "cosine" }
      oneOf:
        - $ref: "#/components/schemas/IntType"
        - $ref: "#/components/schemas/DecimalType"
        - $ref: "#/components/schemas/TextType"
        - $ref: "#/components/schemas/StringType"
        - $ref: "#/components/schemas/BooleanType"
        - $ref: "#/components/schemas/JsonType"
        - $ref: "#/components/schemas/ArrayType"
        - $ref: "#/components/schemas/VectorType"
      discriminator:
        propertyName: "type"
        mapping:
          int: "#/components/schemas/IntType"
          decimal: "#/components/schemas/DecimalType"
          text: "#/components/schemas/TextType"
          string: "#/components/schemas/StringType"
          boolean: "#/components/schemas/BooleanType"
          json: "#/components/schemas/JsonType"
          vector: "#/components/schemas/VectorType"
          "Int[]": "#/components/schemas/ArrayType"
          "Long[]": "#/components/schemas/ArrayType"
          "Decimal[]": "#/components/schemas/ArrayType"
          "String[]": "#/components/schemas/ArrayType"
          "Boolean[]": "#/components/schemas/ArrayType"

    "IntType":
      type: object
      description: |
        "Integer column type."
      example: { "type": "Int" }
      examples:
        - { "type": "Int" }
        - { "type": "Int", "link": "users.id" }
      required:
        - type
      properties:
        type:
          description: "Type of the column."
          type: string
          enum: ["int"]
        nullable:
          description: "When true, `null` values are allowed."
          type: boolean
          default: true
        link:
          description: "Path to a column of a linked row."
          type: string
          default: "null"

    "DecimalType":
      type: object
      description: "Decimal column type."
      example: { "type": "Decimal", "nullable": false }
      required:
        - type
      properties:
        type:
          description: "Type of the column."
          type: string
          enum: ["decimal"]
        nullable:
          description: "When true, `null` values are allowed."
          type: boolean
          default: true
        link:
          description: "Path to a column of a linked row."
          type: string
          default: "null"

    "BooleanType":
      type: object
      description: |
        "Boolean column type.
        When column is a boolean, the only accepted values are `true` and `false`."
      example: { "type": "boolean" }
      required:
        - type
      properties:
        type:
          description: "Type of the column."
          type: string
          enum: ["boolean"]
        nullable:
          description: "When true, `null` values are allowed."
          type: boolean
          default: true
        link:
          description: "Path to a column of a linked row."
          type: string
          default: "null"

    "StringType":
      type: object
      description: |
        "String column type.
        The string data type is a primitive version of the Text type.
        The value is turned into a single feature. For example `"lazy black cat"` becomes 1
        feature: `"lazy black cat"`."
      example: { "type": "String", "nullable": false }
      examples:
        - { "type": "String", "nullable": false }
        - { "type": "String", "link": "messages.id" }
      required:
        - type
      properties:
        type:
          description: "Type of the column."
          type: string
          enum: ["string"]
        nullable:
          description: "When true, `null` values are allowed."
          type: boolean
          default: true
        link:
          description: "Path to a column of a linked row."
          type: string
          default: "null"

    "TextType":
      type: object
      description: |
        "Text column type.

        The text data type allows smarter textual analysis. Aito extracts features of the given text
        contents with the configurable `analyzer`.

        Supported analyzers:
        * `"Whitespace"` Extracts features by white space splitting.
            *"lazy black cat"* would be turned into 3 features: *"lazy"*, *"black"*, *"cat"*.
        * `"English"` Extracts features by English stemming.
            *"aito database"* would be turned into 2 features: *"aito"*, *"databas"*.
        * `"Finnish"`
        * `"Swedish"`
        * `"German"`"
      example: { "type": "Text", "analyzer": "English", "nullable": false }
      required:
        - type
      properties:
        type:
          description: "Type of the column."
          type: string
          enum: ["text"]
        analyzer:
          $ref: "#/components/schemas/Analyzer"
        nullable:
          description: "When true, `null` values are allowed."
          type: boolean
          default: true
        link:
          description: "Path to a column of a linked row."
          type: string
          default: "null"
    "NewColumnType":
      type: object
      allOf:
        - $ref: "#/components/schemas/ColumnType"
        - type: object
          properties:
            value:
              description: "Value that existing rows get.
              Optional if the column is nullable or the table is empty."
              nullable: true
              oneOf:
                - type: integer
                - type: number
                - type: boolean
                - type: "null"
                - type: string

    "JsonType":
      type: object
      description: |
        "Json column type.
        The json data type can be any atomic JSON value, object, array or nested structure.
        The json value is turned into a single feature. For example `{"list":[1, 2], "value":true}` becomes 1
        feature: `{"list":[1, 2], "value":true}`."
      example: { "type": "Json", "nullable": false }
      examples:
        - { "type": "Json", "nullable": true }
      required:
        - type
      properties:
        type:
          description: "Type of the column."
          type: string
          enum: ["json"]
        nullable:
          description: "When true, `null` values are allowed."
          type: boolean
          default: true
        link:
          description: "Path to a column of a linked row."
          type: string
          default: "null"

    "ArrayType":
      type: object
      description: |
        "Array column type.
        Arrays contain ordered lists of primitive values of a single type.
        Supported item types: Int (Int[]), Long (Long[]), Decimal (Decimal[]), Boolean (Boolean[]), String (String[]).
        Arrays are useful for storing multi-valued attributes like tags, categories, or feature vectors."
      example: { "type": "Int[]", "nullable": false }
      examples:
        - { "type": "Int[]" }
        - { "type": "String[]", "nullable": true }
        - { "type": "Decimal[]" }
        - { "type": "Boolean[]" }
      required:
        - type
      properties:
        type:
          description: "Type of the column. Use Type[] syntax for arrays, e.g., Int[], String[]."
          type: string
          enum: ["Int[]", "Long[]", "Decimal[]", "String[]", "Boolean[]"]
        nullable:
          description: "When true, `null` values are allowed for the entire array."
          type: boolean
          default: true

    "VectorType":
      type: object
      description: |
        "Vector column type.
        Stores a fixed-length dense array of numbers (a pre-computed embedding)
        for similarity search with the `$nearest` query operator. Aito does not
        generate embeddings — supply the vector for each row as an array of
        numbers. `cosine` columns are unit-normalised on ingest."
      example: { "type": "Vector", "dimensions": 384, "similarity": "cosine" }
      examples:
        - { "type": "Vector", "dimensions": 384, "similarity": "cosine" }
        - { "type": "Vector", "dimensions": 768, "similarity": "dotProduct", "nullable": true }
      required:
        - type
        - dimensions
      properties:
        type:
          description: "Type of the column."
          type: string
          enum: ["vector"]
        dimensions:
          description: "The vector length. Every value must have exactly this many components."
          type: integer
        similarity:
          description: "How vectors are compared: `cosine` (direction) or `dotProduct` (raw inner product)."
          type: string
          enum: ["cosine", "dotProduct"]
          default: "cosine"
        nullable:
          description: "When true, rows may omit the vector; such rows are skipped by `$nearest`."
          type: boolean
          default: true

    "FileUploadProcessTriggerResponse":
      description: "Processing started status."
      type: object
      required:
        - id
        - status
      properties:
        id:
          type: string
          description: "The id of the operation. Should match the one in the url parameter."
        status:
          type: string
          enum: ["started", "inprogress", "finished"]
          description: "Textual description of the job."

    "FileUploadProcessStatusResponse":
      description: "The file processing status."
      type: object
      required:
        - status
        - errors
      properties:
        status:
          type: object
          required:
            - finished
            - completedCount
            - lastSuccessfulElement
            - finishedAt
            - startedAt
            - thoughput
            - totalDuration
            - totalDurationMs
          properties:
            totalDurationMs:
              type: number
              description: "Total duration of the file processing elapsed"
            totalDuration:
              type: string
              description: "Total duration of the file processing elapsed as human readable units"
            throughput:
              type: string
              description: "Throughput of lines in human readable units"
            startedAt:
              type: string
              format: date-time
              description: "When the file processing was started"
            finishedAt:
              type: string
              format: date-time
              description: "When the file processing was finished"
            finished:
              type: boolean
              description: "Is the job finished or not"
            completedCount:
              type: integer
              description: "The number of lines completed so far"
            lastSuccessfulElement:
              $ref: "#/components/schemas/UserDefinedObject"
        errors:
          type: object
          required:
            - message
          properties:
            message:
              type: string
              description: "Human consumable description."
            rows:
              type: array
              items:
                $ref: "#/components/schemas/UserDefinedObject"
              description: "Array of failing elements. The number of returned elements is restricted."

    "DeleteSchemaResponse":
      description: |
        "Deleted tables."
      type: object
      required:
        - deleted
      example: { "deleted": ["products"] }
      properties:
        deleted:
          type: array
          items:
            type: string
          description: "Array of table names deleted."

    "BatchImportResponse":
      description: |
        "An array of inserted entries."
      type: object
      required:
        - entries
        - status
      properties:
        entries:
          type: integer
          description: "How many entries were inserted."
        status:
          type: string
          description: "Status text"

    "FileUploadStartResponse":
      description: |
        "To be clarified."
      type: object
      required:
        - id
        - url
        - method
        - expires
      properties:
        id:
          type: string
          format: uuid
          description: "The uuid of the file upload session"
        url:
          type: string
          description: "The presigned S3 url where to push the data"
        method:
          type: string
          description: "The http method used for uploading to S3"
        expires:
          type: string
          format: date-time
          description: "Defines when the presigned upload link expires"
    "Analyzer":
      oneOf:
        - $ref: "#/components/schemas/DelimiterAnalyzer"
        - $ref: "#/components/schemas/CharNGramAnalyzer"
        - $ref: "#/components/schemas/LanguageAnalyzer"
        - $ref: "#/components/schemas/TokenNGramAnalyzer"
        - $ref: "#/components/schemas/AliasAnalyzer"
      examples:
        - "standard"
        - "whitespace"
        - "english"
        - "en"
        - { "type": "delimiter", "delimiter": "," }
        - { "type": "language", "language": "en" }
        - { "type": "char-ngram", "minGram": 2, "maxGram": 3 }
        - { "type": "token-ngram", "source": "english", "minGram": 1, "maxGram": 2 }
    "DelimiterAnalyzer":
      type: object
      required:
        - type
        - delimiter
      examples:
        - { "type": "delimiter", "delimiter": "," }
        - { "type": "delimiter", "delimiter": "\n", "trimWhitespace": true }
      properties:
        type:
          description: "Type of the analyzer."
          type: string
          enum: ["delimiter"]
        delimiter:
          type: string
          description: "The delimiter"
        "trimWhitespace":
          description: "Trims leading and trailing whitespace of the features"
          type: boolean
          default: true
    "CharNGramAnalyzer":
      type: object
      required:
        - type
        - minGram
        - maxGram
      example: { "type": "char-ngram", "minGram": 2, "maxGram": 3 }
      properties:
        type:
          description: "Type of the analyzer."
          type: string
          enum: ["char-ngram"]
        minGram:
          description: "The minimum length of characters in a feature."
          type: integer
          format: int32
        maxGram:
          description: "The maximum length of characters in a feature."
          type: integer
          format: int32
    "LanguageAnalyzer":
      type: object
      required:
        - type
