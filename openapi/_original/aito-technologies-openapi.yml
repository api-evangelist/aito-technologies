        $hash:
          oneOf:
            - $ref: "#/components/schemas/Proposition"
            - $ref: "#/components/schemas/PrimitiveProposition"
    "Projection":
      oneOf:
        - $ref: "#/components/schemas/ProjectionList"
        - $ref: "#/components/schemas/IndexProjection"
        - $ref: "#/components/schemas/RankProjection"
        - $ref: "#/components/schemas/ParametricWhy"
        - $ref: "#/components/schemas/ParametricHighlight"
        - $ref: "#/components/schemas/HighlightProjection"
        - $ref: "#/components/schemas/ParametricMatches"
        - $ref: "#/components/schemas/MatchesProjection"
        - $ref: "#/components/schemas/Expand"
        - $ref: "#/components/schemas/ScoreOperator"
        - $ref: "#/components/schemas/ProjectionField"
        - $ref: "#/components/schemas/NamedProjection"
    "ParametricHighlight":
      example: {
        "$highlight": {
          "posPreTag": "<b>",
          "posPostTag": "</b>",
          "negPreTag": "<em>",
          "negPostTag": "</em>",
          "encoder": "html"
        }
      }
      type: object
      properties:
        $highlight:
          type: object
          properties:
            "posPreTag":
              type: string
            "posPostTag":
              type: string
            "negPreTag":
              type: string
            "negPostTag":
              type: string
            "posThreshold":
              type: number
            "negThreshold":
              type: number
            "encoder":
              type: string
    "V2TableDefinition":
      type: object
      properties:
        type:
          type: string
          description: "Table type: 'collection' for CollectionDb (optimized) or 'table' for legacy TableDb"
          enum: ["table", "collection"]
          default: "table"
        columns:
          type: object
          additionalProperties:
            type: object
            required: ["type"]
            properties:
              type:
                type: string
                description: >
                  Column data type. Scalars: String, Int, Long, Decimal, Boolean,
                  Text (needs an analyzer), Json, Date. Append [] for an array of
                  that type (e.g. String[], Int[]). Date is stored ISO-8601
                  (YYYY-MM-DD) and queryable by component ($year, $month,
                  $weekday, ...).
                enum: ["String", "Int", "Long", "Decimal", "Boolean", "Text", "Json", "Date",
                       "String[]", "Int[]", "Long[]", "Decimal[]", "Boolean[]", "Text[]", "Json[]", "Date[]"]
              nullable:
                type: boolean
                description: "Whether the column allows null values (a real defined-mask for scalar columns, not a sentinel)."
              quantity:
                type: boolean
                description: >
                  For numeric columns (Int / Long / Decimal): mark the column a
                  quantity (nearby values share evidence — binned) vs an
                  identifier (each value stands alone). Default: Decimal = true,
                  Int / Long = false.
              link:
                type: string
                description: "Link to another table in format 'tableName.columnName'. Paths traverse multiple hops in queries."
              analyzer:
                type: string
                description: "Text analyzer to use (e.g., 'standard')"
    "V2Query":
      type: object
      required: ["from"]
      description: >
        A v2 (Query2 engine) query. The same from/where evidence drives plain
        queries, predictions, recommendations and relation analysis, selected
        by which of predict / recommend / relate / search is present. See the
        v2 Query Operator Reference guide for the full where/orderBy/select
        grammar.
      properties:
        from:
          type: string
          description: "The table (collection) to query."
        where:
          type: object
          description: >
            Filter / evidence conditions. A field-value pair is equality
            (e.g. category = books). Operators inside a field: $has,
            $match (text), $exact, $gt / $gte / $lt / $lte, $mod,
            $exists, and $numeric (adaptive neighbourhood binning). Top-level
            logical combinators: $and, $or, $not (each over nested
            where-objects), and $on (observe a condition only where another
            holds).
        predict:
          type: string
          description: "Field to predict — ranks its values by probability given the where evidence."
        recommend:
          type: string
          description: "Link field to recommend on. Like predict, paired with goal."
        goal:
          type: object
          description: >
            Desired outcome for recommend — a where-style object, e.g.
            purchase = true. The recommendation ranks candidates by the
            probability of this goal.
        relate:
          type: array
          items:
            type: string
          description: "Fields to find statistical relations for. Returns relation statistics, not rows."
        search:
          type: object
          description: >
            Text search sugar — an object with field and text keys; equivalent
            to a where + predict on that text field.
        basedOn:
          type: array
          items:
            type: string
          description: "Linked-table fields to project into the prediction context as cross-table evidence."
        orderBy:
          description: >
            Result ordering. A field name; the string $p to rank by prediction
            probability; or an object of the form $p over a $context where-
            object to rank candidates by the probability of a condition
            evaluated against the context (from) table. The object form with
            field and desc keys sorts a plain field.
          oneOf:
            - type: string
            - type: object
        select:
          description: >
            Fields to include per hit. Besides column names, predictive queries
            expose computed columns: $value (the candidate value), $p (its
            probability), and $why (the explanation factor tree — base
            probability times related-proposition lifts times normalizers).
          oneOf:
            - type: array
              items:
                type: string
            - type: string
        having:
          type: object
          description: >
            Candidate filter on the per-candidate frequency $f. Only the form
            {"$f": {"$gte"|"$gt"|"$lte"|"$lt": <number>}} is accepted, on a
            predict/recommend/get candidate query. {"$f": {"$gte": 1}} keeps
            only values that actually co-occur with the where — the server-side
            tenant-scoping idiom (where supplies evidence, not an output
            domain). Applied after ranking, before offset/limit; no
            renormalisation.
        config:
          type: object
          description: >
            Per-query inference configuration, e.g. an ai key selecting an
            inference profile.
        offset:
          type: integer
          description: "Number of results to skip (default: 0)."
        limit:
          type: integer
          description: "Maximum number of results to return (default: 10)."
    "V2QueryResponse":
      type: object
      properties:
        offset:
          type: integer
        total:
          type: integer
        hits:
          type: array
          items:
            type: object
    "V2SqlPgResponse":
      type: object
      description: "The pg-format SQL response — the REST rendering of a PostgreSQL result (node-postgres Result shape). fields carries the wire protocol's RowDescription attributes; rows are positional arrays, so column order, column types, duplicate names and NULL-vs-absent are all expressible. total is rows MATCHING (rowCount is rows RETURNED; under a LIMIT they differ)."
      properties:
        command:
          type: string
          example: "SELECT"
        rowCount:
          type: integer
        total:
          type: integer
        fields:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              tableID:
                type: integer
              columnID:
                type: integer
              dataTypeID:
                type: integer
                description: "The PostgreSQL type OID (23 = int4, 25 = text, ...)."
              dataTypeSize:
                type: integer
                description: "Postgres typlen: byte size of a fixed-size type, -1 for variable-length."
              dataTypeModifier:
                type: integer
              format:
                type: string
        rows:
          type: array
          items:
            type: array
            items: {}
        warnings:
          type: array
          items:
            type: object
