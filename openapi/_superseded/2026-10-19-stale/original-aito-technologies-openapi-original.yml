        - informationGain
        - mxe
        - h
        - geomMeanP
        - baseGmp
        - geomMeanLift
        - meanNs
        - meanUs
        - meanMs
        - medianNs
        - medianUs
        - medianMs
        - warmingMs
      properties:
        n:
          description: |
            The amount of samples used for testing. Alias for `testSamples`.
          type: integer
          format: int64
        testSamples:
          description: |
            The amount of samples used for testing.
          type: integer
          format: int64
        trainSamples:
          description: |
            The average amount of samples used for training.
          type: number
        features:
          description: |
            The average number of features
          type: number
        error:
          description: |
            Complement of `accuracy` (=`1 - accuracy`).
          type: number
        baseError:
          description: |
            Complement of `baseAccuracy` (=`1 - baseAccuracy`).
          type: number
        accuracy:
          description: |
            The accuracy of predictions.
          type: number
        baseAccuracy:
          description: |
            The simulated accuracy of predictions based on taking the most frequent value. This is not the actual Aito accuracy, but useful to understand how much better results Aito can provide.
          type: number
        accuracyGain:
          description: |
            How much better results Aito was able to provide compared to a naive prediction. `accuracy - baseAccuracy`.
          type: number
        meanRank:
          description: |
            Average rank of the best prediction
          type: number
        baseMeanRank:
          description: |

          type: number
        rankGain:
          description: |
            Improvement of meanRank upon baseMeanRank
          type: number
        informationGain:
          description: |
            A measurement which describes the quality of probabilities (=`h - mxe`).
          type: number
        mxe:
          description: |
            Mean cross entropy
          type: number
        h:
          description: |
            Entropy
          type: number
        geomMeanP:
          description: |
            The mean geometric probability of the predictions
          type: number
        baseGmp:
          description: |
            Base geometric mean probability.
          type: number
        geomMeanLift:
          description: |
            Geometric mean lift. `geomMeanP / baseGmp`
          type: number
        meanNs:
          description: |
            The mean execution time of the queries in nanoseconds.
          type: number
        meanUs:
          description: |
            The mean execution time of the queries in microseconds.
          type: number
        meanMs:
          description: |
            The mean execution time of the queries in milliseconds.
          type: number
        medianNs:
          description: |
            The median execution time of the queries in nanoseconds.
          type: number
        medianUs:
          description: |
            The median execution time of the queries in microseconds.
          type: number
        medianMs:
          description: |
            The median execution time of the queries in milliseconds.
          type: number
        warmingMs:
          description: |
            The time spent for warm-up of indexes and caches for the given query in milliseconds.
          type: number
