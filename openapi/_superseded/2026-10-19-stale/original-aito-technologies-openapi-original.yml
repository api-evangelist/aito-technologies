    "Analyzer":
      oneOf:
        - $ref: "#/components/schemas/DelimiterAnalyzer"
        - $ref: "#/components/schemas/CharNGramAnalyzer"
        - $ref: "#/components/schemas/LanguageAnalyzer"
        - $ref: "#/components/schemas/TokenNGramAnalyzer"
        - $ref: "#/components/schemas/AliasAnalyzer"
      examples:
        - "standard"
        - "whitespace"
        - "english"
        - "en"
        - { "type": "delimiter", "delimiter": "," }
        - { "type": "language", "language": "en" }
        - { "type": "char-ngram", "minGram": 2, "maxGram": 3 }
        - { "type": "token-ngram", "source": "english", "minGram": 1, "maxGram": 2 }
    "DelimiterAnalyzer":
      type: object
      required:
        - type
        - delimiter
      examples:
        - { "type": "delimiter", "delimiter": "," }
        - { "type": "delimiter", "delimiter": "\n", "trimWhitespace": true }
      properties:
        type:
          description: "Type of the analyzer."
          type: string
          enum: ["delimiter"]
        delimiter:
          type: string
          description: "The delimiter"
        "trimWhitespace":
          description: "Trims leading and trailing whitespace of the features"
          type: boolean
          default: true
    "CharNGramAnalyzer":
      type: object
      required:
        - type
        - minGram
        - maxGram
      example: { "type": "char-ngram", "minGram": 2, "maxGram": 3 }
      properties:
        type:
          description: "Type of the analyzer."
          type: string
          enum: ["char-ngram"]
        minGram:
          description: "The minimum length of characters in a feature."
          type: integer
          format: int32
        maxGram:
          description: "The maximum length of characters in a feature."
          type: integer
          format: int32
    "LanguageAnalyzer":
      type: object
      required:
        - type
        - language
      examples:
        - { "type": "language", "language": "en" }
        - { "type": "language", "language": "english", "useDefaultStopWords": true, "customStopWords": ["flower"], "customKeyWords": ["animal"] }
      properties:
        type:
          description: "Type of the analyzer."
          type: string
          enum: ["language"]
        language:
          description: "Name or code of the language."
          type: string
        useDefaultStopWords:
          description: "Use the language default stopwords."
          type: boolean
          default: false
        customStopWords:
          description: "List of words that will be filtered."
          type: array
          default: []
          items:
            type: string
        customKeyWords:
          description: "List of words that will not be featurizerd."
          type: array
          default: []
          items:
            type: string
    "TokenNGramAnalyzer":
      type: object
      required:
        - type
        - source
        - minGram
        - maxGram
      examples:
        - { "type": "token-ngram", "source": "english", "minGram": 1, "maxGram": 2 }
        - { "type": "token-ngram", "source": { "type": "delimiter", "delimiter": "," }, "minGram": 1, "maxGram": 3, "tokenSeparator": "_" }
      properties:
        type:
          description: "Type of the analyzer."
          type: string
          enum: ["token-ngram"]
        source:
          description: "Source analyzer to generate features before being combined into n-grams."
          $ref: "#/components/schemas/Analyzer"
        minGram:
          description: "The minimum number of features to be combined."
          type: integer
          format: int32
        "maxGram":
          description: "The maximum number of features to be combined."
          type: integer
          format: int32
        "tokenSeparator":
          description: "The string used to join the features of the source analyzer."
          type: string
          default: "\" \""
    "AliasAnalyzer":
      type: string
      examples:
        - "standard"
        - "whitespace"
        - "english"
        - "en"
