          type: boolean
          description: |
            Exclusiveness dictates that only one feature can be true at the same time and that one feature will be true.

            In practice, exclusiveness enforces the probabilities of alternative features to
            sum to 1.0. This is achieved with a normalizer. The normalizer is of form:

            ```
