openapi: 3.2.0
info:
  title: Aito Technologies Data API
  description: Data management endpoints for inserting, deleting, and optimizing
security:
- ApiKeyAuth: []
tags:
- name: Data
  description: Data management endpoints for inserting, deleting, and optimizing
paths:
  /api/v1/data/{table}:
    post:
      tags:
      - Data
      description: Insert a single data entry intp the specified table.
      parameters:
      - $ref: '#/components/parameters/Table'
      requestBody:
        required: true
        description: Any object which is valid according to the provisioned schema
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserDefinedObjectInternalWrapper'
      responses:
        200:
          description: The inserted entry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDefinedObjectInternalWrapper'
        400:
          description: Invalid request body
      summary: Create api data by table
      x-summary-source: derived
      operationId: postApiV1DataByTable
      x-operation-id-source: derived
  /api/v1/data/{table}/batch:
    post:
      tags:
      - Data
      description: 'Insert a batch of data entries into the specfied table. The batch is assumed to be a JSON array of valid entries according to the provisioned schema. ***NOTE***: Batch API supports maximum payloads of 10MB.'
      parameters:
      - $ref: '#/components/parameters/Table'
      requestBody:
        required: true
        description: An array of objects which are valid according to the provisioned schema
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/UserDefinedObject'
      responses:
        200:
          description: Summary of the inserted entries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchImportResponse'
        400:
          description: Invalid request body
      summary: Create api data by table batch
      x-summary-source: derived
      operationId: postApiV1DataByTableBatch
      x-operation-id-source: derived
  /api/v1/data/{table}/optimize:
    post:
      tags:
      - Data
      summary: optimize optimizes the database by rewriting it as a single segment
      requestBody:
        required: true
        description: An empty object
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OptimizeOperation'
      responses:
        200:
          description: An empty object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OptimizeOperationResponse'
        400:
          description: Invalid request body
      operationId: postApiV1DataByTableOptimize
      x-operation-id-source: derived
  /api/v1/data/{table}/file:
    post:
      tags:
      - Data
      description: 'The first step of inserting data entries into the specified table using file-upload.

        The operation returns a signed S3-URL and a method so that one can upload the file using the accepeted method. ***NOTE***: The file must be in gzip compressed ndjson format.

        The operation also returns an id that will be used when triggering file processing See step 2.'
      parameters:
      - $ref: '#/components/parameters/Table'
      responses:
        200:
          description: The details to execute the S3 upload and the job's id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileUploadStartResponse'
        400:
          description: Invalid request body
      summary: Create api data by table file
      x-summary-source: derived
      operationId: postApiV1DataByTableFile
      x-operation-id-source: derived
  /api/v1/data/{table}/file/{uuid}:
    post:
      tags:
      - Data
      description: 'The second step of inserting data entries into the specified table using file-upload See the first step: Initiate file upload.

        The operation starts the processing a previously uploaded file. ***NOTE***: The specified id must match the job id from the previous file upload initiation.'
      parameters:
      - $ref: '#/components/parameters/Table'
      - $ref: '#/components/parameters/JobId'
      responses:
        200:
          description: Processing started status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileUploadProcessTriggerResponse'
        400:
          description: Invalid request body
      summary: Create api data by table file by uuid
      x-summary-source: derived
      operationId: postApiV1DataByTableFileByUuid
      x-operation-id-source: derived
    get:
      tags:
      - Data
      description: 'Return the current status of the specified file upload job using its id. ***NOTE***: The specfied id must match the job id from the previous file upload initiation.'
      parameters:
      - $ref: '#/components/parameters/Table'
      - $ref: '#/components/parameters/JobId'
      responses:
        200:
          description: The file processing status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileUploadProcessStatusResponse'
          400:
            description: Invalid request body
      summary: Get api data by table file by uuid
      x-summary-source: derived
      operationId: getApiV1DataByTableFileByUuid
      x-operation-id-source: derived
  /api/v1/data/_delete:
    post:
      tags:
      - Data
      operationId: delete
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteOperation'
      responses:
        200:
          description: Delete results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteOperationResponse'
        400:
          description: Invalid request body
      summary: Delete
      x-summary-source: derived
  /api/v1/data/_modify:
    post:
      tags:
      - Data
      operationId: modify
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnyModification'
      responses:
        200:
          description: Modify results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnyModification'
        400:
          description: Invalid request body
      summary: Modify
      x-summary-source: derived
  /api/v2/data/{table}:
    post:
      tags:
      - Data
      description: Insert a single data entry into the specified table. Supports both TableDb and CollectionDb tables.
      operationId: v2-data-insert
      parameters:
      - $ref: '#/components/parameters/Table'
      requestBody:
        required: true
        description: Any object valid according to the table schema
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserDefinedObjectInternalWrapper'
      responses:
        200:
          description: Status of the insert operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  entries:
                    type: integer
        400:
          description: Invalid request body
      summary: V2 data insert
      x-summary-source: derived
  /api/v2/data/{table}/batch:
    post:
      tags:
      - Data
      description: Insert a batch of data entries into the specified table. The batch is a JSON array of valid entries according to the table schema. Supports both TableDb and CollectionDb tables.
      operationId: v2-data-batch
      parameters:
      - $ref: '#/components/parameters/Table'
      requestBody:
        required: true
        description: An array of objects valid according to the table schema
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/UserDefinedObject'
      responses:
        200:
          description: Summary of the insert operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  entries:
                    type: integer
        400:
          description: Invalid request body
      summary: V2 data batch
      x-summary-source: derived
  /api/v2/data/{table}/stream:
    post:
      tags:
      - Data
      description: Insert data entries using newline-delimited JSON (NDJSON) format. Each line is a separate JSON object. Supports both TableDb and CollectionDb tables.
      operationId: v2-data-stream
      parameters:
      - $ref: '#/components/parameters/Table'
      requestBody:
        required: true
        description: Newline-delimited JSON objects
        content:
          application/json:
            schema:
              type: string
              description: NDJSON format - one JSON object per line
      responses:
        200:
          description: Summary of the insert operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  entries:
                    type: integer
        400:
          description: Invalid request body
      summary: V2 data stream
      x-summary-source: derived
  /api/v2/data/{table}/_cluster:
    post:
      tags:
      - Data
      description: Fit a k-means codebook over a dense vector/embedding column and store each row's cluster id as a derived column — WITHOUT changing the declared schema. Turns embeddings into a categorical the query engine can use as evidence.
      operationId: v2-data-cluster
      parameters:
      - $ref: '#/components/parameters/Table'
      requestBody:
        required: true
        description: 'Cluster spec: the source vector column, the codebook size, and an optional output-column name.'
        content:
          application/json:
            schema:
              type: object
              required:
              - column
              properties:
                column:
                  type: string
                  description: The dense vector/embedding column to cluster.
                k:
                  type: integer
                  description: Number of clusters (codebook size). Default 64.
                as:
                  type: string
                  description: Name of the derived cluster-id column. Default <column>_cluster.
      responses:
        200:
          description: Cluster summary
          content:
            application/json:
              schema:
                type: object
        400:
          description: Invalid request
      summary: V2 data cluster
      x-summary-source: derived
  /api/v2/data/{table}/optimize:
    post:
      tags:
      - Data
      summary: Optimize the table by merging segments for better read performance
      operationId: v2-data-optimize
      parameters:
      - $ref: '#/components/parameters/Table'
      requestBody:
        required: true
        description: An empty object
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OptimizeOperation'
      responses:
        200:
          description: An empty object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OptimizeOperationResponse'
        400:
          description: Invalid request body
  /api/v2/data/{table}/repair:
    post:
      tags:
      - Data
      summary: Rebuild the table's binary from its seed (recovery).
      operationId: v2-data-repair
      parameters:
      - $ref: '#/components/parameters/Table'
      requestBody:
        required: true
        description: An empty object
        content:
          application/json:
            schema:
              type: object
      responses:
        200:
          description: An empty object
          content:
            application/json:
              schema:
                type: object
        400:
          description: Invalid request body
  /api/v2/data/_delete:
    post:
      tags:
      - Data
      description: Delete the rows matching a where clause — exactly the rows a _query with the same where returns. Supports both TableDb and CollectionDb tables. The where is a field value (equality), a field condition with $eq, $ne, $lt, $lte, $gt, $gte, $in or $not, and $and / $or / $not around those. A negation selects the rows that HAVE a value other than the negated one (a row with the field unset is not deleted). An unknown operator or column is a 400, never a silent zero-row delete; an empty where is refused (drop the table instead).
      operationId: v2-data-delete
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - from
              properties:
                from:
                  type: string
                  description: Table name
                where:
                  type: object
                  description: Query conditions for matching entries to delete
      responses:
        200:
          description: Number of deleted entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
        400:
          description: Invalid request body
      summary: V2 data delete
      x-summary-source: derived
  /api/v2/data/_modify:
    post:
      tags:
      - Data
      description: 'Atomic table + data operations, applied in one commit. Accepts one operation object, or {operations: [...]} to apply several. ROW OPS: insert ({into, insert}), update ({update, set, where, upsert?}), delete ({from, delete}), backfill ({backfill, key, keys, columns, upsert?} - bulk-set column values on existing rows by key). TABLE OPS: copy ({from, copy, replace?}) grafts a table by reference (zero-copy); `from` may be a nested path (a/b), a subtree wildcard (a/*), or name another ref of this database as "ref:path" (env.NAME or release.NAME) to copy across branches/releases, and `copy` may itself be nested. move ({move, to, replace?}) relocates a top-level table to a new, possibly nested name (creates the sub-env, drops the source). link ({from, link, replace?}) stores a live reference resolved on every read, instead of a snapshot copy. rename ({from, rename}) renames a table. MAINTENANCE: optimize ({optimize}), repair ({repair}) rebuilds a table from its seed to recover a structurally-broken segment, warm ({warm: [queries]}). Requires a read-write API key.'
      operationId: v2-data-modify
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnyModification'
      responses:
        200:
          description: Modification results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnyModification'
        400:
          description: Invalid request body
      summary: V2 data modify
      x-summary-source: derived
  /api/v2/data/{table}/_backfill:
    post:
      tags:
      - Data
      description: Bulk-set column values on existing rows, matched by a business key — the compact way to populate a column with new values after adding it. The columnar body carries a `key` column name plus index-aligned `keys` and `columns` value arrays, so it stays small for large jobs. Applied in one commit; a key that matches no row is a no-op unless `upsert` is true. Sugar over the `backfill` operation of _modify; works on both TableDb and CollectionDb.
      operationId: v2-data-backfill
      parameters:
      - $ref: '#/components/parameters/Table'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - key
              - keys
              - columns
              properties:
                key:
                  type: string
                  description: The business-key column used to match existing rows
                keys:
                  type: array
                  description: Key values, one per row to update
                  items: {}
                columns:
                  type: object
                  description: Column name -> array of new values, each array index-aligned to `keys`
                  additionalProperties:
                    type: array
                    items: {}
                upsert:
                  type: boolean
                  default: false
                  description: If true, insert a new row for a key that matches nothing
      responses:
        200:
          description: Number of rows updated (plus inserted, when upsert)
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
        400:
          description: Invalid request body (missing key/keys/columns, or arrays not index-aligned)
      summary: V2 data backfill
      x-summary-source: derived
  /api/v2/data/{table}/import:
    post:
      tags:
      - Data
      description: 'Schema-flexible JSON import: POST an array of objects and Aito infers the column types, creating the table if it doesn''t exist and appending if it does (extending the schema with any new fields — existing rows get null). Use ?type=table to create a legacy rep1 table instead of a collection.'
      operationId: v2-data-import
      parameters:
      - $ref: '#/components/parameters/Table'
      - name: type
        in: query
        required: false
        description: collection (default) or table.
        schema:
          type: string
          enum:
          - collection
          - table
      requestBody:
        required: true
        description: A JSON array of objects to import.
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
      responses:
        200:
          description: Import status, count, and the (inferred) schema.
        400:
          description: Invalid request body
      summary: V2 data import
      x-summary-source: derived
components:
  schemas:
    UserDefinedObject:
      example:
        name: My product
        price: 172.19
      type: object
    Patterns:
      example:
        from: invoices
        where:
          GLCode: R001
        relate:
          $patterns:
          - Description
          - Processor
          - Acceptor
      examples:
      - from: invoices
        where:
          GLCode: R001
        relate:
          $patterns:
          - Description
          - Processor
          - Acceptor
      - from: visits
        where:
          weekday: Saturday
        relate:
          $patterns:
            $related:
              relate:
              - purchases
              k: 16
              to:
                weekday: Saturday
              by: lift
      type: object
      properties:
        $patterns:
          $ref: '#/components/schemas/PropositionSet'
    FileUploadProcessTriggerResponse:
      description: Processing started status.
      type: object
      required:
      - id
      - status
      properties:
        id:
          type: string
          description: The id of the operation. Should match the one in the url parameter.
        status:
          type: string
          enum:
          - started
          - inprogress
          - finished
          description: Textual description of the job.
    DeleteOperationResponse:
      type: object
      required:
      - total
      properties:
        total:
          description: 'The number of rows that was deleted

            '
          type: integer
          format: int64
    FieldProposition:
      type: object
      required:
      - fieldName
      properties:
        fieldName:
          oneOf:
          - $ref: '#/components/schemas/Proposition'
          - $ref: '#/components/schemas/PrimitiveProposition'
    NnPropositionArray:
      example:
      - tags: laptop
      type: array
      minItems: 2
      maxItems: 2
      items:
        oneOf:
        - oneOf:
          - $ref: '#/components/schemas/Proposition'
          - $ref: '#/components/schemas/PrimitiveProposition'
        - type: number
    Mod:
      example:
        $mod:
        - 2
        - 0
      examples:
      - $mod:
        - 2
        - 0
      - $mod:
          divisor: 2
          remainder: 0
      - from: products
        where:
          price:
            $mod:
              divisor: 2
              remainder: 0
      type: object
      properties:
        $mod:
          oneOf:
          - $ref: '#/components/schemas/ModPropositionObject'
          - $ref: '#/components/schemas/ModPropositionArray'
    ToString:
      example:
        $toString: 4
      type: object
      properties:
        $toString:
          oneOf:
          - $ref: '#/components/schemas/GetValueExpression'
          - type: integer
            format: int32
          - type: integer
            format: int64
          - type: number
          - type: 'null'
          - $ref: '#/components/schemas/ArrayValue'
          - $ref: '#/components/schemas/ToString'
          - type: boolean
          - type: string
          - $ref: '#/components/schemas/Json'
    NnPropositionObject:
      type: object
      example:
        near:
          tags: laptop
      required:
      - near
      properties:
        near:
          example:
            tags: laptop
          oneOf:
          - $ref: '#/components/schemas/Proposition'
          - $ref: '#/components/schemas/PrimitiveProposition'
        threshold:
          type: number
    DeleteOperation:
      type: object
      example:
        from: user
        where:
          id: 4
      required:
      - from
      - where
      properties:
        from:
          example: user
          $ref: '#/components/schemas/FromTablemodify'
          description: The modified table
        where:
          example:
            id: 4
          $ref: '#/components/schemas/Proposition'
          description: The entries to delete
    SamplePropositionObject:
      type: object
      example:
        n: 100
        seed: 0
      required:
      - n
      properties:
        n:
          example: 100
          type: integer
          format: int64
        of:
          $ref: '#/components/schemas/Proposition'
        seed:
          example: 0
          type: integer
          format: int64
    Proposition:
      example:
        customer: 4
        query:
          $match: laptop
      examples:
      - customer: 4
        query:
          $match: laptop
      - price:
          $gte: 50
          $lt: 100
      - tags:
          $match: laptop
      type: object
      oneOf:
      - $ref: '#/components/schemas/Is'
      - $ref: '#/components/schemas/And'
      - $ref: '#/components/schemas/Atomic'
      - $ref: '#/components/schemas/Exact'
      - $ref: '#/components/schemas/Or'
      - $ref: '#/components/schemas/Not'
      - $ref: '#/components/schemas/Defined'
      - $ref: '#/components/schemas/Has'
      - $ref: '#/components/schemas/Exists'
      - $ref: '#/components/schemas/Patterns'
      - $ref: '#/components/schemas/Related'
      - $ref: '#/components/schemas/Match'
      - $ref: '#/components/schemas/StartsWith'
      - $ref: '#/components/schemas/On'
      - $ref: '#/components/schemas/Hash'
      - $ref: '#/components/schemas/Mod'
      - $ref: '#/components/schemas/Sample'
      - $ref: '#/components/schemas/Gt'
      - $ref: '#/components/schemas/Gte'
      - $ref: '#/components/schemas/Lt'
      - $ref: '#/components/schemas/Lte'
      - $ref: '#/components/schemas/Context'
      - $ref: '#/components/schemas/Knn'
      - $ref: '#/components/schemas/Nn'
      - $ref: '#/components/schemas/Numeric'
      - oneOf:
        - $ref: '#/components/schemas/ToString'
        - $ref: '#/components/schemas/GetValueExpression'
      - $ref: '#/components/schemas/FieldProposition'
    KnnPropositionArray:
      example:
      - 4
      - tags: laptop
      type: array
      minItems: 2
      maxItems: 2
      items:
        oneOf:
        - type: integer
          format: int32
        - oneOf:
          - $ref: '#/components/schemas/Proposition'
          - $ref: '#/components/schemas/PrimitiveProposition'
    Atomic:
      example:
        $atomic:
          tags: pen
          price:
            $gte: 200
      examples:
      - $atomic:
          tags: pen
          price:
            $gte: 200
      - from: products
        where:
          $atomic:
            tags: pen
            price:
              $gte: 200
      type: object
      properties:
        $atomic:
          $ref: '#/components/schemas/Proposition'
    PrimitiveProposition:
      example: 4
      examples:
      - 4
      - 3.1
      - false
      - null
      - text
      oneOf:
      - $ref: '#/components/schemas/GetValueExpression'
      - type: integer
        format: int32
      - type: integer
        format: int64
      - type: number
      - type: 'null'
      - $ref: '#/components/schemas/ArrayValue'
      - $ref: '#/components/schemas/ToString'
      - type: boolean
      - type: string
      - $ref: '#/components/schemas/Json'
    Related:
      example:
        from: invoices
        where:
          GLCode: R001
        relate:
          $patterns:
            $related:
              relate:
              - Description
              - ProductName
              k: 16
              to:
                GLCode: R001
      type: object
      properties:
        $related:
          $ref: '#/components/schemas/RelatedPropositionObject'
    OptimizeOperationResponse:
      type: object
      example: {}
      properties: null
    OptimizeOperation:
      type: object
      example: {}
      properties: null
    FileUploadStartResponse:
      description: '"To be clarified."

        '
      type: object
      required:
      - id
      - url
      - method
      - expires
      properties:
        id:
          type: string
          format: uuid
          description: The uuid of the file upload session
        url:
          type: string
          description: The presigned S3 url where to push the data
        method:
          type: string
          description: The http method used for uploading to S3
        expires:
          type: string
          format: date-time
          description: Defines when the presigned upload link expires
    OptimizeOperation2:
      type: object
      example:
        optimize: users
      required:
      - optimize
      properties:
        optimize:
          example: users
          type: string
          description: Table to optimize
    GetValueExpression:
      example:
        $get: query
      examples:
      - $get: query
      - $get: click
      - $get: product.title
      type: object
      properties:
        $get:
          type: string
    FileUploadProcessStatusResponse:
      description: The file processing status.
      type: object
      required:
      - status
      - errors
      properties:
        status:
          type: object
          required:
          - finished
          - completedCount
          - lastSuccessfulElement
          - finishedAt
          - startedAt
          - thoughput
          - totalDuration
          - totalDurationMs
          properties:
            totalDurationMs:
              type: number
              description: Total duration of the file processing elapsed
            totalDuration:
              type: string
              description: Total duration of the file processing elapsed as human readable units
            throughput:
              type: string
              description: Throughput of lines in human readable units
            startedAt:
              type: string
              format: date-time
              description: When the file processing was started
            finishedAt:
              type: string
              format: date-time
              description: When the file processing was finished
            finished:
              type: boolean
              description: Is the job finished or not
            completedCount:
              type: integer
              description: The number of lines completed so far
            lastSuccessfulElement:
              $ref: '#/components/schemas/UserDefinedObject'
        errors:
          type: object
          required:
          - message
          properties:
            message:
              type: string
              description: Human consumable description.
            rows:
              type: array
              items:
                $ref: '#/components/schemas/UserDefinedObject'
              description: Array of failing elements. The number of returned elements is restricted.
    OnPropositionObject:
