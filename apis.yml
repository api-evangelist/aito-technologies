aid: aito-technologies
name: Aito Technologies
description: 'Aito Technologies (Aito.ai, legal entity Episto Oy of Vantaa, Finland)
  builds a predictive database that delivers instant, calibrated machine-learning predictions
  from live business data with no model training. Its REST Query API exposes a SQL-like
  JSON interface for prediction, recommendation, similarity search, classification, pattern
  matching, and statistical relation over your own tables, alongside schema and data-management
  endpoints. Aito powers predictive accounting (GL coding, invoice routing, fraud detection),
  predictive ERP, and predictive e-commerce, and is delivered as an EU-hosted cloud service
  (Ireland, eu-west-1) or a self-hosted Docker container. Authentication is an x-api-key
  header with read-only and read/write key types.'
